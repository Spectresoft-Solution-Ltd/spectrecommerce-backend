name: SpectreCommerce CI

on:
  push:
    branches:
      - main
      - staging

  pull_request:
    branches:
      - main
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-main-source:
    name: Validate PR source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Ensure PR comes from staging
        run: |
          if [ "$GITHUB_HEAD_REF" != "staging" ]; then
            echo "ERROR: Pull requests to main must come from staging."
            exit 1
          fi

          echo "Valid source branch: staging"

  quality-check:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spectrecommerce_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
